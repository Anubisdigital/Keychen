 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Malaika AI · Catering Assistant</title>
  <meta name="description" content="Chat with Malaika AI — your smart catering assistant for menus, pricing, and event planning in Kampala.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #CC0000;
      --dark-red: #A30000;
      --black: #1A1A1A;
      --gold: #D4A017;
      --cream: #FDF6EC;
      --section: #F5ECD7;
      --card: #FFFFFF;
      --muted: #6B5B45;
      --border: rgba(107, 91, 69, 0.2);
      --green: #25D366;
      --fh: 'Marcellus', serif;
      --fb: 'Plus Jakarta Sans', sans-serif;
      --shadow-sm: 0 8px 30px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    body {
      background: linear-gradient(145deg, var(--cream) 0%, #fef7ef 100%);
      font-family: var(--fb);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* main chat card */
    .chat-app {
      max-width: 900px;
      width: 100%;
      height: 85vh;
      min-height: 560px;
      background: var(--card);
      border-radius: 32px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.2s ease;
      border: 1px solid rgba(212, 160, 23, 0.2);
    }

    /* header */
    .chat-header {
      background: var(--black);
      padding: 1rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--gold);
    }
    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      background: var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      color: white;
      box-shadow: 0 4px 12px rgba(204,0,0,0.3);
    }
    .brand-text h1 {
      font-family: var(--fh);
      font-size: 1.35rem;
      color: white;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }
    .brand-text h1 span {
      color: var(--gold);
    }
    .brand-text p {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }
    .chat-actions {
      display: flex;
      gap: 12px;
    }
    .clear-chat {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #ddd;
      font-size: 1rem;
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .clear-chat:hover {
      background: rgba(255,255,255,0.2);
      color: var(--gold);
      transform: scale(0.96);
    }
    .status-badge {
      font-size: 0.7rem;
      background: rgba(37,211,102,0.2);
      padding: 4px 12px;
      border-radius: 40px;
      color: #2ecc71;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge i {
      font-size: 0.55rem;
    }

    /* messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #FFFCF8;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #f0e7db;
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 10px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeSlideUp 0.25s ease;
    }
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--section);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .message.user .message-avatar {
      background: var(--red);
      color: white;
    }
    .message.bot .message-avatar {
      background: var(--black);
      color: var(--gold);
    }
    .bubble {
      background: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      line-height: 1.55;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      border: 1px solid rgba(212, 160, 23, 0.2);
      color: #2c2c2c;
    }
    .message.user .bubble {
      background: var(--red);
      color: white;
      border: none;
      border-radius: 20px 20px 4px 20px;
    }
    .message.bot .bubble {
      background: #ffffff;
      border-radius: 20px 20px 20px 4px;
      border-left: 3px solid var(--gold);
    }
    .typing-indicator {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 18px;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      border: 1px solid rgba(212, 160, 23, 0.25);
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #b9a77d;
      border-radius: 50%;
      display: inline-block;
      animation: wave 1.3s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* suggestions chips */
    .suggestions {
      padding: 8px 1.8rem 12px 1.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid rgba(107, 91, 69, 0.1);
      background: #FFFCF8;
    }
    .chip {
      background: #f1ebe2;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--fb);
    }
    .chip i {
      font-size: 0.7rem;
      color: var(--gold);
    }
    .chip:hover {
      background: var(--gold);
      color: var(--black);
      transform: translateY(-2px);
    }
    .chip:active {
      transform: translateY(1px);
    }

    /* input area */
    .input-area {
      background: white;
      padding: 1rem 1.8rem 1.5rem 1.8rem;
      border-top: 1px solid rgba(0,0,0,0.05);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      background: #f9f5ee;
      border-radius: 48px;
      padding: 6px 6px 6px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(107, 91, 69, 0.2);
      transition: all 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(212,160,23,0.2);
      background: white;
    }
    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 0.9rem;
      font-family: var(--fb);
      outline: none;
      color: var(--black);
    }
    .input-wrapper input::placeholder {
      color: #b1a087;
      font-weight: 400;
    }
    .send-btn {
      background: var(--red);
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 46px;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(204,0,0,0.2);
    }
    .send-btn:hover:not(:disabled) {
      background: var(--dark-red);
      transform: scale(1.02);
    }
    .send-btn:disabled {
      background: #d1bfa8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .footer-note {
      text-align: center;
      font-size: 0.68rem;
      padding: 8px 1.8rem 12px;
      color: var(--muted);
      background: white;
      border-top: 1px solid rgba(0,0,0,0.02);
    }
    .footer-note a {
      color: var(--red);
      text-decoration: none;
      font-weight: 500;
    }
    @media (max-width: 620px) {
      body {
        padding: 12px;
      }
      .chat-app {
        height: 92vh;
        border-radius: 24px;
      }
      .message {
        max-width: 95%;
      }
      .chat-messages {
        padding: 1rem;
      }
      .input-area {
        padding: 0.8rem 1rem 1.2rem;
      }
      .suggestions {
        padding: 8px 1rem;
      }
      .brand-text h1 {
        font-size: 1.1rem;
      }
      .avatar {
        width: 40px;
        height: 40px;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
<div class="chat-app">
  <div class="chat-header">
    <div class="brand-area">
      <div class="avatar">
        <i class="fa-solid fa-robot"></i>
      </div>
      <div class="brand-text">
        <h1>Malaika's <span>Keychen</span> AI</h1>
        <p>your catering consultant · Kampala</p>
      </div>
    </div>
    <div class="chat-actions">
      <div class="status-badge">
        <i class="fa-solid fa-circle"></i> online
      </div>
      <button class="clear-chat" id="clearChatBtn" aria-label="Clear conversation">
        <i class="fa-regular fa-trash-alt"></i>
      </button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <!-- initial bot message will be injected via JS -->
  </div>

  <div class="suggestions" id="suggestionsRow">
    <button class="chip" data-question="What catering packages do you offer?"><i class="fa-solid fa-utensils"></i> Packages</button>
    <button class="chip" data-question="What is the minimum number of guests?"><i class="fa-regular fa-users"></i> Min. guests</button>
    <button class="chip" data-question="How much is your starting price per plate?"><i class="fa-solid fa-coins"></i> Starting price</button>
    <button class="chip" data-question="Do you handle setup & staff?"><i class="fa-solid fa-champagne-glasses"></i> Full service</button>
    <button class="chip" data-question="How do I book an event?"><i class="fa-brands fa-whatsapp"></i> Booking</button>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="chatInput" placeholder="Ask about menus, pricing, weddings, intros..." autocomplete="off">
    </div>
    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
  <div class="footer-note">
    <i class="fa-regular fa-message"></i> AI assistant trained on Malaika’s catering & events • <a href="#" id="waRedirect">📞 WhatsApp 0777920311</a>
  </div>
</div>

<script>
  // ------------------- CONFIGURATION ----------------------
  const WORKER_URL = "https://groq-system.lubegadoreen02.workers.dev/";
  
  // chat state
  let conversationHistory = [];    // stores { role: "user" | "assistant", content: string }
  let isWaiting = false;
  let currentTypingElement = null;

  // DOM elements
  const chatContainer = document.getElementById("chatMessages");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearChatBtn");
  const suggestionsContainer = document.getElementById("suggestionsRow");
  const waRedirect = document.getElementById("waRedirect");

  // Helper: scroll to bottom smoothly
  function scrollToBottom() {
    if (chatContainer) {
      chatContainer.scrollTo({
        top: chatContainer.scrollHeight,
        behavior: "smooth"
      });
    }
  }

  // Render a message bubble (without storing duplicate)
  function addMessageToUI(role, content) {
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${role}`;
    
    const avatarDiv = document.createElement("div");
    avatarDiv.className = "message-avatar";
    if (role === "user") {
      avatarDiv.innerHTML = '<i class="fa-regular fa-user"></i>';
    } else {
      avatarDiv.innerHTML = '<i class="fa-solid fa-robot" style="font-size: 0.8rem;"></i>';
    }
    
    const bubbleDiv = document.createElement("div");
    bubbleDiv.className = "bubble";
    bubbleDiv.innerText = content;
    
    messageDiv.appendChild(avatarDiv);
    messageDiv.appendChild(bubbleDiv);
    chatContainer.appendChild(messageDiv);
    scrollToBottom();
    return messageDiv;
  }

  // Remove typing indicator if exists
  function removeTypingIndicator() {
    const existingTyping = document.getElementById("typingMsgElement");
    if (existingTyping) existingTyping.remove();
  }

  // Show "AI is typing..." indicator
  function showTypingIndicator() {
    removeTypingIndicator();
    const typingDiv = document.createElement("div");
    typingDiv.className = "message bot";
    typingDiv.id = "typingMsgElement";
    const avatarSpan = document.createElement("div");
    avatarSpan.className = "message-avatar";
    avatarSpan.innerHTML = '<i class="fa-solid fa-robot"></i>';
    const typingBubble = document.createElement("div");
    typingBubble.className = "typing-indicator";
    typingBubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    typingDiv.appendChild(avatarSpan);
    typingDiv.appendChild(typingBubble);
    chatContainer.appendChild(typingDiv);
    scrollToBottom();
  }

  // Append AI response (actual message) and store history
  function appendBotMessage(text) {
    removeTypingIndicator();
    addMessageToUI("bot", text);
    conversationHistory.push({ role: "assistant", content: text });
    // Trim memory if too long (keep last 30 messages for context)
    if (conversationHistory.length > 30) {
      conversationHistory = conversationHistory.slice(-30);
    }
    isWaiting = false;
    enableInput(true);
  }

  // Handle error message
  function handleError(errorMsg = "Sorry, I'm having trouble connecting. Please try again or reach out via WhatsApp.") {
    removeTypingIndicator();
    addMessageToUI("bot", errorMsg);
    isWaiting = false;
    enableInput(true);
  }

  function enableInput(enabled) {
    sendBtn.disabled = !enabled;
    chatInput.disabled = !enabled;
    if (enabled) chatInput.focus();
  }

  // Send message to worker (core AI request)
  async function sendMessageToAI(userMessage) {
    if (isWaiting) return;
    if (!userMessage.trim()) return;
    
    // Add user message to UI and conversation history
    addMessageToUI("user", userMessage);
    conversationHistory.push({ role: "user", content: userMessage });
    
    // Disable input while waiting
    isWaiting = true;
    enableInput(false);
    showTypingIndicator();
    
    // Prepare payload for worker: send last 12 exchanges for context (max efficiency)
    const historyForContext = conversationHistory.slice(-12); // last 6 pairs roughly
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);
      
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: userMessage,
          history: historyForContext
        }),
        signal: controller.signal
      });
      
      clearTimeout(timeoutId);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      
      const data = await response.json();
      if (data.reply && typeof data.reply === "string") {
        appendBotMessage(data.reply);
      } else if (data.error) {
        handleError(`🤖 Oops: ${data.error}. But you can always WhatsApp us for instant support!`);
      } else {
        handleError("I received an unexpected response. Please ask again or contact us directly.");
      }
    } catch (err) {
      console.error("Chat worker error:", err);
      if (err.name === "AbortError") {
        handleError("⏳ The request took too long. Our AI might be busy — please try again or WhatsApp us.");
      } else {
        handleError("📡 Connection issue. Kindly check your network or reach out via WhatsApp 0777920311 for catering help.");
      }
    }
  }

  // Reset entire conversation (clear history + UI)
  function resetConversation() {
    if (isWaiting) return;
    // Clear DOM messages
    while (chatContainer.firstChild) {
      chatContainer.removeChild(chatContainer.firstChild);
    }
    // reset history array
    conversationHistory = [];
    // Add fresh welcome message
    const welcomeText = "👋 Hello! I'm Malaika AI, your personal catering assistant. I can help with menu packages (UGX 20k–50k per plate), minimum 40 guests, event setups, bookings, and more. What would you like to know?";
    addMessageToUI("bot", welcomeText);
    conversationHistory.push({ role: "assistant", content: welcomeText });
    // scroll to welcome
    scrollToBottom();
    enableInput(true);
    isWaiting = false;
    removeTypingIndicator();
  }

  // Send event handler (from input or button)
  function handleSend() {
    const rawMsg = chatInput.value.trim();
    if (!rawMsg) return;
    chatInput.value = "";
    sendMessageToAI(rawMsg);
  }

  // Optional: Quick suggestions chips
  function setupSuggestions() {
    const chips = document.querySelectorAll(".chip");
    chips.forEach(chip => {
      chip.addEventListener("click", (e) => {
        e.preventDefault();
        const question = chip.getAttribute("data-question");
        if (question && !isWaiting) {
          chatInput.value = question;
          handleSend();
        }
      });
    });
  }

  // WhatsApp redirect link to keep contact handy
  function setupWhatsAppLink() {
    if (waRedirect) {
      waRedirect.addEventListener("click", (e) => {
        e.preventDefault();
        window.open("https://wa.me/256777920311?text=Hello%20Malaika's%20Keychen%2C%20I%20just%20chatted%20with%20the%20AI%20and%20would%20like%20to%20make%20a%20booking.", "_blank");
      });
    }
  }
  
  // Make sure initial message appears on load
  function initChat() {
    resetConversation();   // loads welcome message + history
    enableInput(true);
    isWaiting = false;
    chatInput.focus();
  }

  // Event listeners
  sendBtn.addEventListener("click", handleSend);
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!isWaiting && chatInput.value.trim().length > 0) {
        handleSend();
      }
    }
  });
  clearBtn.addEventListener("click", () => {
    if (!isWaiting) {
      resetConversation();
    } else {
      // small feedback if AI busy
      addMessageToUI("bot", "⏳ I'm thinking, please wait a moment before clearing the chat.");
      setTimeout(() => {
        const lastMsg = chatContainer.lastChild;
        if (lastMsg && lastMsg.innerText.includes("thinking")) lastMsg.remove();
      }, 2000);
    }
  });
  
  // Additional behaviour: handle offline or retry, also user experience
  window.addEventListener("load", () => {
    initChat();
    setupSuggestions();
    setupWhatsAppLink();
    // add resize observer for scroll (optional)
  });
  
  // ensuring that if user clicks any link inside footer-note doesn't break
  document.querySelectorAll(".footer-note a").forEach(link => {
    if (link.id !== "waRedirect") {
      link.addEventListener("click", (e) => e.preventDefault());
    }
  });
</script>
</body>
      </html>
