<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Malaika's Keychen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfe2N4mPyWxBmVelw6tbdMtuwjlStsNz8",
            authDomain: "malaikas1.firebaseapp.com",
            projectId: "malaikas1",
            storageBucket: "malaikas1.firebasestorage.app",
            messagingSenderId: "976814756153",
            appId: "1:976814756153:web:86063b30546cac306a18e8",
            measurementId: "G-CMY2N3RTRE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ── Cloudinary config ──────────────────────────────────────────────────────
        const CLOUD_NAME = "dopuutcka";
        const UPLOAD_PRESET = "anubis_malaika";

        async function uploadToCloudinary(file) {
            const fd = new FormData();
            fd.append("file", file);
            fd.append("upload_preset", UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
            if (!res.ok) throw new Error("Cloudinary upload failed");
            const data = await res.json();
            return data.secure_url;
        }

        // ── State ──────────────────────────────────────────────────────────────────
        let currentSection = "dashboard";
        let editingId = null;

        // ── Auth guard ─────────────────────────────────────────────────────────────
        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminShell").style.display = "flex";
                document.getElementById("adminUserEmail").textContent = user.email;
                loadSection("dashboard");
            } else {
                document.getElementById("loginScreen").style.display = "flex";
                document.getElementById("adminShell").style.display = "none";
            }
        });

        window.adminLogin = async function() {
            const email = document.getElementById("loginEmail").value.trim();
            const pass  = document.getElementById("loginPass").value;
            const errEl = document.getElementById("loginError");
            errEl.textContent = "";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch(e) {
                errEl.textContent = "Invalid credentials. Try again.";
            }
        };

        window.adminLogout = async function() {
            await signOut(auth);
        };

        // ── Sidebar navigation ─────────────────────────────────────────────────────
        window.loadSection = function(section) {
            currentSection = section;
            editingId = null;
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            const activeBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
            if (activeBtn) activeBtn.classList.add("active");
            document.getElementById("sectionTitle").textContent = {
                dashboard: "Dashboard",
                products:  "Products",
                accounts:  "User Accounts",
                blog:      "Blog Posts",
                gallery:   "Gallery",
                menus:     "Catering Menus"
            }[section] || section;
            const main = document.getElementById("mainContent");
            main.innerHTML = `<div class="loader-wrap"><div class="loader"></div></div>`;
            // Close drawer on mobile
            document.getElementById("sidebar").classList.remove("open");
            document.getElementById("sidebarOverlay").classList.remove("active");
            setTimeout(() => renderSection(section), 300);
        };

        // ── Section Router ─────────────────────────────────────────────────────────
        async function renderSection(section) {
            const main = document.getElementById("mainContent");
            switch(section) {
                case "dashboard": await renderDashboard(main); break;
                case "products":  await renderProducts(main);  break;
                case "accounts":  await renderAccounts(main);  break;
                case "blog":      await renderBlog(main);      break;
                case "gallery":   await renderGallery(main);   break;
                case "menus":     await renderMenus(main);     break;
            }
        }

        // ── DASHBOARD ──────────────────────────────────────────────────────────────
        async function renderDashboard(main) {
            const counts = {};
            for (const col of ["products","blog","gallery","menus","accounts"]) {
                const snap = await getDocs(collection(db, col));
                counts[col] = snap.size;
            }
            main.innerHTML = `
            <div class="dash-grid">
                <div class="dash-card" onclick="loadSection('products')">
                    <i class="fa-solid fa-box-open"></i>
                    <div class="dash-info"><span class="dash-num">${counts.products}</span><span class="dash-label">Products</span></div>
                </div>
                <div class="dash-card" onclick="loadSection('accounts')">
                    <i class="fa-solid fa-users"></i>
                    <div class="dash-info"><span class="dash-num">${counts.accounts}</span><span class="dash-label">Accounts</span></div>
                </div>
                <div class="dash-card" onclick="loadSection('blog')">
                    <i class="fa-solid fa-newspaper"></i>
                    <div class="dash-info"><span class="dash-num">${counts.blog}</span><span class="dash-label">Blog Posts</span></div>
                </div>
                <div class="dash-card" onclick="loadSection('gallery')">
                    <i class="fa-solid fa-images"></i>
                    <div class="dash-info"><span class="dash-num">${counts.gallery}</span><span class="dash-label">Gallery Images</span></div>
                </div>
                <div class="dash-card" onclick="loadSection('menus')">
                    <i class="fa-solid fa-utensils"></i>
                    <div class="dash-info"><span class="dash-num">${counts.menus}</span><span class="dash-label">Menu Packages</span></div>
                </div>
            </div>
            <div class="dash-notice">
                <i class="fa-solid fa-circle-info"></i>
                <p>Welcome back, Admin. Use the sidebar to manage all content on Malaika's Keychen website.</p>
            </div>`;
        }

        // ── PRODUCTS (CARD GRID) ─────────────────────────────────────────────────
        async function renderProducts(main) {
            const snap = await getDocs(query(collection(db,"products"), orderBy("createdAt","desc")));
            const cards = snap.docs.map(d => {
                const p = d.data();
                const safeData = JSON.stringify({id:d.id, ...p}).replace(/"/g, "&quot;");
                return `
                <div class="data-card">
                    <div class="card-img-wrap">
                        <img src="${p.image||''}" alt="${p.name||''}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-body">
                        <h4 class="card-title">${p.name||'Untitled'}</h4>
                        <span class="card-tag">${p.menuType||'—'}</span>
                        <div class="card-price">UGX ${(p.price||0).toLocaleString()}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon edit" onclick='openProductModal(${safeData})'>
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-icon del" onclick="deleteItem('products','${d.id}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            }).join("");

            main.innerHTML = `
            <div class="section-bar">
                <button class="btn-add" onclick="openProductModal(null)"><i class="fa-solid fa-plus"></i> Add Product</button>
            </div>
            <div class="card-grid">
                ${cards || '<p class="empty-row">No products yet.</p>'}
            </div>
            <!-- Modal -->
            <div class="modal-backdrop" id="productModal" style="display:none">
                <div class="modal">
                    <div class="modal-head">
                        <h3 id="productModalTitle">Add Product</h3>
                        <button class="modal-close" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="pName" placeholder="e.g. Steamed Matooke">
                        </div>
                        <div class="form-group">
                            <label>Note / Description</label>
                            <textarea id="pNote" rows="3" placeholder="Short description..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Tools / Equipment</label>
                            <input type="text" id="pTools" placeholder="e.g. Chafing dish, serving spoon">
                        </div>
                        <div class="form-group">
                            <label>Ingredients</label>
                            <textarea id="pIngredients" rows="3" placeholder="List ingredients..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Preparation Notes</label>
                            <textarea id="pPrep" rows="3" placeholder="Preparation steps..."></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Price (UGX) *</label>
                                <input type="number" id="pPrice" placeholder="50000">
                            </div>
                            <div class="form-group">
                                <label>Menu Type / Package</label>
                                <select id="pMenuType">
                                    <option value="">Select...</option>
                                    <option>20,000 Package</option>
                                    <option>25,000 Package</option>
                                    <option>30,000 Package</option>
                                    <option>35,000 Package</option>
                                    <option>40,000 Package</option>
                                    <option>45,000 Package</option>
                                    <option>50,000 Package</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Product Image</label>
                            <div class="upload-zone" id="pImgZone" onclick="document.getElementById('pImgFile').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p>Click to upload image</p>
                                <input type="file" id="pImgFile" accept="image/*" style="display:none" onchange="previewImage(this,'pImgPreview','pImgZone')">
                            </div>
                            <img id="pImgPreview" class="img-preview" style="display:none">
                            <input type="hidden" id="pImgUrl">
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal('productModal')">Cancel</button>
                            <button class="btn-save" onclick="saveProduct()"><i class="fa-solid fa-floppy-disk"></i> Save Product</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.openProductModal = function(data) {
            editingId = data ? data.id : null;
            document.getElementById("productModalTitle").textContent = data ? "Edit Product" : "Add Product";
            document.getElementById("pName").value        = data?.name || "";
            document.getElementById("pNote").value        = data?.note || "";
            document.getElementById("pTools").value       = data?.tools || "";
            document.getElementById("pIngredients").value = data?.ingredients || "";
            document.getElementById("pPrep").value        = data?.preparation || "";
            document.getElementById("pPrice").value       = data?.price || "";
            document.getElementById("pMenuType").value    = data?.menuType || "";
            document.getElementById("pImgUrl").value      = data?.image || "";
            const prev = document.getElementById("pImgPreview");
            if (data?.image) { prev.src = data.image; prev.style.display = "block"; }
            else { prev.style.display = "none"; }
            document.getElementById("productModal").style.display = "flex";
        };

        window.saveProduct = async function() {
            const btn = document.querySelector("#productModal .btn-save");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;
            btn.disabled = true;
            try {
                const file = document.getElementById("pImgFile").files[0];
                let imageUrl = document.getElementById("pImgUrl").value;
                if (file) imageUrl = await uploadToCloudinary(file);

                const data = {
                    name:        document.getElementById("pName").value.trim(),
                    note:        document.getElementById("pNote").value.trim(),
                    tools:       document.getElementById("pTools").value.trim(),
                    ingredients: document.getElementById("pIngredients").value.trim(),
                    preparation: document.getElementById("pPrep").value.trim(),
                    price:       Number(document.getElementById("pPrice").value),
                    menuType:    document.getElementById("pMenuType").value,
                    image:       imageUrl,
                    updatedAt:   serverTimestamp()
                };
                if (!data.name) { showToast("Product name is required","error"); return; }

                if (editingId) {
                    await updateDoc(doc(db,"products",editingId), data);
                    showToast("Product updated!");
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db,"products"), data);
                    showToast("Product added!");
                }
                closeModal("productModal");
                await renderProducts(document.getElementById("mainContent"));
            } catch(e) {
                showToast("Error: "+e.message,"error");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Product`;
                btn.disabled = false;
            }
        };

        // ── ACCOUNTS (CARD GRID) ────────────────────────────────────────────────
        async function renderAccounts(main) {
            const snap = await getDocs(query(collection(db,"accounts"), orderBy("createdAt","desc")));
            const cards = snap.docs.map(d => {
                const a = d.data();
                return `
                <div class="data-card">
                    <div class="card-body">
                        <h4 class="card-title"><i class="fa-solid fa-user"></i> ${a.username||'—'}</h4>
                        <div class="card-detail"><i class="fa-solid fa-envelope"></i> ${a.email||'—'}</div>
                        <div class="card-detail"><i class="fa-solid fa-phone"></i> ${a.phone||'—'}</div>
                        <div class="card-detail"><i class="fa-solid fa-location-dot"></i> ${a.location||'—'}</div>
                        <div class="card-detail">
                            <span class="badge ${a.locationEnabled?'green':'grey'}">${a.locationEnabled?'Location ON':'Location OFF'}</span>
                        </div>
                        <div class="card-meta">Joined ${a.createdAt?.toDate?.()?.toLocaleDateString()||'—'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon del" onclick="deleteItem('accounts','${d.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            }).join("");

            main.innerHTML = `
            <div class="section-bar">
                <p class="section-note"><i class="fa-solid fa-circle-info"></i> Accounts are created from the website. View-only here.</p>
            </div>
            <div class="card-grid">
                ${cards||'<p class="empty-row">No accounts yet.</p>'}
            </div>`;
        }

        // ── BLOG (CARD GRID) ────────────────────────────────────────────────────
        async function renderBlog(main) {
            const snap = await getDocs(query(collection(db,"blog"), orderBy("createdAt","desc")));
            const cards = snap.docs.map(d => {
                const b = d.data();
                const safeData = JSON.stringify({id:d.id, ...b}).replace(/"/g, "&quot;");
                return `
                <div class="data-card">
                    <div class="card-img-wrap">
                        <img src="${b.image||''}" alt="${b.title||''}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-body">
                        <h4 class="card-title">${b.title||'Untitled'}</h4>
                        <p class="card-excerpt">${(b.content||'').substring(0,100)}…</p>
                        <div class="card-meta">${b.createdAt?.toDate?.()?.toLocaleDateString()||'—'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon edit" onclick='openBlogModal(${safeData})'>
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-icon del" onclick="deleteItem('blog','${d.id}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            }).join("");

            main.innerHTML = `
            <div class="section-bar">
                <button class="btn-add" onclick="openBlogModal(null)"><i class="fa-solid fa-plus"></i> New Post</button>
            </div>
            <div class="card-grid">
                ${cards||'<p class="empty-row">No blog posts yet.</p>'}
            </div>
            <!-- Blog Modal -->
            <div class="modal-backdrop" id="blogModal" style="display:none">
                <div class="modal modal-wide">
                    <div class="modal-head">
                        <h3 id="blogModalTitle">New Blog Post</h3>
                        <button class="modal-close" onclick="closeModal('blogModal')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Post Title *</label>
                            <input type="text" id="bTitle" placeholder="Enter title...">
                        </div>
                        <div class="form-group">
                            <label>Content *</label>
                            <div class="rich-toolbar">
                                <button type="button" onclick="execFormat('bold')" title="Bold"><i class="fa-solid fa-bold"></i></button>
                                <button type="button" onclick="execFormat('italic')" title="Italic"><i class="fa-solid fa-italic"></i></button>
                                <button type="button" onclick="execFormat('underline')" title="Underline"><i class="fa-solid fa-underline"></i></button>
                                <button type="button" onclick="execFormat('strikeThrough')" title="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
                                <span class="toolbar-sep"></span>
                                <button type="button" onclick="execFormat('insertUnorderedList')" title="Bullet list"><i class="fa-solid fa-list-ul"></i></button>
                                <button type="button" onclick="execFormat('insertOrderedList')" title="Numbered list"><i class="fa-solid fa-list-ol"></i></button>
                                <span class="toolbar-sep"></span>
                                <button type="button" onclick="execFormat('justifyLeft')" title="Left"><i class="fa-solid fa-align-left"></i></button>
                                <button type="button" onclick="execFormat('justifyCenter')" title="Center"><i class="fa-solid fa-align-center"></i></button>
                                <button type="button" onclick="execFormat('justifyRight')" title="Right"><i class="fa-solid fa-align-right"></i></button>
                            </div>
                            <div id="bContent" class="rich-editor" contenteditable="true" placeholder="Write your post here..."></div>
                        </div>
                        <div class="form-group">
                            <label>Cover Image</label>
                            <div class="upload-zone" onclick="document.getElementById('bImgFile').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i><p>Click to upload</p>
                                <input type="file" id="bImgFile" accept="image/*" style="display:none" onchange="previewImage(this,'bImgPreview')">
                            </div>
                            <img id="bImgPreview" class="img-preview" style="display:none">
                            <input type="hidden" id="bImgUrl">
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal('blogModal')">Cancel</button>
                            <button class="btn-save" onclick="saveBlog()"><i class="fa-solid fa-floppy-disk"></i> Publish Post</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.execFormat = function(cmd) { document.execCommand(cmd, false, null); };

        window.openBlogModal = function(data) {
            editingId = data ? data.id : null;
            document.getElementById("blogModalTitle").textContent = data ? "Edit Post" : "New Blog Post";
            document.getElementById("bTitle").value = data?.title || "";
            document.getElementById("bContent").innerHTML = data?.content || "";
            document.getElementById("bImgUrl").value = data?.image || "";
            const prev = document.getElementById("bImgPreview");
            if (data?.image) { prev.src = data.image; prev.style.display = "block"; }
            else prev.style.display = "none";
            document.getElementById("blogModal").style.display = "flex";
        };

        window.saveBlog = async function() {
            const btn = document.querySelector("#blogModal .btn-save");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Publishing...`; btn.disabled = true;
            try {
                const file = document.getElementById("bImgFile").files[0];
                let imageUrl = document.getElementById("bImgUrl").value;
                if (file) imageUrl = await uploadToCloudinary(file);
                const data = {
                    title:     document.getElementById("bTitle").value.trim(),
                    content:   document.getElementById("bContent").innerHTML,
                    image:     imageUrl,
                    updatedAt: serverTimestamp()
                };
                if (!data.title) { showToast("Title is required","error"); return; }
                if (editingId) {
                    await updateDoc(doc(db,"blog",editingId), data);
                    showToast("Post updated!");
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db,"blog"), data);
                    showToast("Post published!");
                }
                closeModal("blogModal");
                await renderBlog(document.getElementById("mainContent"));
            } catch(e) { showToast("Error: "+e.message,"error");
            } finally { btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Publish Post`; btn.disabled = false; }
        };

        // ── GALLERY (unchanged, already grid) ────────────────────────────────────
        async function renderGallery(main) {
            const snap = await getDocs(query(collection(db,"gallery"), orderBy("createdAt","desc")));
            const cards = snap.docs.map(d => {
                const g = d.data();
                return `<div class="gal-card">
                    <img src="${g.url||''}" alt="${g.alt||''}">
                    <div class="gal-overlay">
                        <span>${g.alt||'No caption'}</span>
                        <button class="btn-icon del white" onclick="deleteItem('gallery','${d.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            }).join("");

            main.innerHTML = `
            <div class="section-bar">
                <button class="btn-add" onclick="openGalleryModal()"><i class="fa-solid fa-plus"></i> Upload Image</button>
            </div>
            <div class="gallery-grid">${cards||'<p class="empty-row">No images yet.</p>'}</div>
            <!-- Gallery Modal -->
            <div class="modal-backdrop" id="galleryModal" style="display:none">
                <div class="modal">
                    <div class="modal-head">
                        <h3>Upload Gallery Image</h3>
                        <button class="modal-close" onclick="closeModal('galleryModal')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Image *</label>
                            <div class="upload-zone" onclick="document.getElementById('gImgFile').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i><p>Click to upload</p>
                                <input type="file" id="gImgFile" accept="image/*" style="display:none" onchange="previewImage(this,'gImgPreview')">
                            </div>
                            <img id="gImgPreview" class="img-preview" style="display:none">
                        </div>
                        <div class="form-group">
                            <label>Caption / Alt text</label>
                            <input type="text" id="gAlt" placeholder="e.g. Wedding buffet setup at Munyonyo">
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal('galleryModal')">Cancel</button>
                            <button class="btn-save" onclick="saveGallery()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.openGalleryModal = function() {
            document.getElementById("gAlt").value = "";
            document.getElementById("gImgPreview").style.display = "none";
            document.getElementById("galleryModal").style.display = "flex";
        };

        window.saveGallery = async function() {
            const btn = document.querySelector("#galleryModal .btn-save");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading...`; btn.disabled = true;
            try {
                const file = document.getElementById("gImgFile").files[0];
                if (!file) { showToast("Please select an image","error"); return; }
                const url = await uploadToCloudinary(file);
                await addDoc(collection(db,"gallery"), { url, alt: document.getElementById("gAlt").value.trim(), createdAt: serverTimestamp() });
                showToast("Image uploaded!");
                closeModal("galleryModal");
                await renderGallery(document.getElementById("mainContent"));
            } catch(e) { showToast("Error: "+e.message,"error");
            } finally { btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Upload`; btn.disabled = false; }
        };

        // ── MENUS (CARD GRID) ──────────────────────────────────────────────────
        async function renderMenus(main) {
            const snap = await getDocs(query(collection(db,"menus"), orderBy("price","asc")));
            const cards = snap.docs.map(d => {
                const m = d.data();
                const safeData = JSON.stringify({id:d.id, ...m}).replace(/"/g, "&quot;");
                return `
                <div class="data-card">
                    <div class="card-body">
                        <div class="card-price"><span>UGX ${(m.price||0).toLocaleString()}</span> / plate</div>
                        <div class="card-detail"><strong>Main:</strong> ${(m.main||[]).join(", ") || '—'}</div>
                        <div class="card-detail"><strong>Sides:</strong> ${(m.sides||[]).join(", ") || '—'}</div>
                        <div class="card-detail"><strong>Dessert:</strong> ${(m.dessert||[]).join(", ") || '—'}</div>
                        ${m.note ? `<div class="card-detail"><strong>Note:</strong> ${m.note}</div>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon edit" onclick='openMenuModal(${safeData})'>
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-icon del" onclick="deleteItem('menus','${d.id}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>`;
            }).join("");

            main.innerHTML = `
            <div class="section-bar">
                <button class="btn-add" onclick="openMenuModal(null)"><i class="fa-solid fa-plus"></i> Add Menu Package</button>
            </div>
            <div class="card-grid">
                ${cards||'<p class="empty-row">No menus yet.</p>'}
            </div>
            <!-- Menu Modal -->
            <div class="modal-backdrop" id="menuModal" style="display:none">
                <div class="modal modal-wide">
                    <div class="modal-head">
                        <h3 id="menuModalTitle">Add Menu Package</h3>
                        <button class="modal-close" onclick="closeModal('menuModal')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Price per Plate (UGX) *</label>
                            <input type="number" id="mPrice" placeholder="e.g. 30000">
                        </div>
                        <div class="form-group">
                            <label>Main Dishes * <span class="hint">(one per line)</span></label>
                            <textarea id="mMain" rows="5" placeholder="Steamed Matooke&#10;Pilau Rice&#10;Beef Stew..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Sides <span class="hint">(one per line)</span></label>
                            <textarea id="mSides" rows="4" placeholder="Groundnuts&#10;Greens&#10;Chapati..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Dessert <span class="hint">(one per line)</span></label>
                            <textarea id="mDessert" rows="3" placeholder="Mixed fruit salad&#10;Coleslaw..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Note (Optional)</label>
                            <input type="text" id="mNote" placeholder="e.g. Includes luwombo for premium events">
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal('menuModal')">Cancel</button>
                            <button class="btn-save" onclick="saveMenu()"><i class="fa-solid fa-floppy-disk"></i> Save Menu</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.openMenuModal = function(data) {
            editingId = data ? data.id : null;
            document.getElementById("menuModalTitle").textContent = data ? "Edit Menu" : "Add Menu Package";
            document.getElementById("mPrice").value   = data?.price || "";
            document.getElementById("mMain").value    = (data?.main   ||[]).join("\n");
            document.getElementById("mSides").value   = (data?.sides  ||[]).join("\n");
            document.getElementById("mDessert").value = (data?.dessert||[]).join("\n");
            document.getElementById("mNote").value    = data?.note || "";
            document.getElementById("menuModal").style.display = "flex";
        };

        window.saveMenu = async function() {
            const btn = document.querySelector("#menuModal .btn-save");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`; btn.disabled = true;
            try {
                const toArr = str => str.split("\n").map(s=>s.trim()).filter(Boolean);
                const data = {
                    price:     Number(document.getElementById("mPrice").value),
                    main:      toArr(document.getElementById("mMain").value),
                    sides:     toArr(document.getElementById("mSides").value),
                    dessert:   toArr(document.getElementById("mDessert").value),
                    note:      document.getElementById("mNote").value.trim(),
                    updatedAt: serverTimestamp()
                };
                if (!data.price || data.main.length===0) { showToast("Price and main dishes required","error"); return; }
                if (editingId) {
                    await updateDoc(doc(db,"menus",editingId), data);
                    showToast("Menu updated!");
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db,"menus"), data);
                    showToast("Menu added!");
                }
                closeModal("menuModal");
                await renderMenus(document.getElementById("mainContent"));
            } catch(e) { showToast("Error: "+e.message,"error");
            } finally { btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Menu`; btn.disabled = false; }
        };

        // ── Helpers ───────────────────────────────────────────────────────────────
        window.deleteItem = async function(col, id) {
            if (!confirm("Are you sure you want to delete this item? This cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, col, id));
                showToast("Deleted successfully.");
                loadSection(currentSection);
            } catch(e) { showToast("Delete failed: "+e.message,"error"); }
        };

        window.closeModal = function(id) { document.getElementById(id).style.display = "none"; };

        window.previewImage = function(input, previewId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const prev = document.getElementById(previewId);
                prev.src = e.target.result;
                prev.style.display = "block";
            };
            reader.readAsDataURL(file);
        };

        window.showToast = function(msg, type="success") {
            const t = document.createElement("div");
            t.className = `toast toast-${type}`;
            t.innerHTML = `<i class="fa-solid fa-${type==='success'?'circle-check':'circle-exclamation'}"></i> ${msg}`;
            document.getElementById("toastArea").appendChild(t);
            setTimeout(() => t.classList.add("show"), 50);
            setTimeout(() => { t.classList.remove("show"); setTimeout(()=>t.remove(),400); }, 3500);
        };

        // Sidebar toggle (mobile)
        window.toggleSidebar = function() {
            document.getElementById("sidebar").classList.toggle("open");
            document.getElementById("sidebarOverlay").classList.toggle("active");
        };
        window.closeSidebar = function() {
            document.getElementById("sidebar").classList.remove("open");
            document.getElementById("sidebarOverlay").classList.remove("active");
        };
    </script>

        .upload-zone {
            border: 2px dashed #c9b99a; border-radius: 8px; padding: 30px;
            text-align: center; cursor: pointer; transition: var(--ease);
            background: var(--cream); color: var(--muted);
        }
        .upload-zone:hover { border-color: var(--red); background: rgba(204,0,0,0.03); }
        .upload-zone i { font-size: 2rem; color: var(--gold); margin-bottom: 8px; display: block; }
        .upload-zone p { font-size: 0.85rem; }
        .img-preview { max-height: 160px; border-radius: 6px; margin-top: 12px; object-fit: cover; width: auto; max-width: 100%; }

        /* Buttons */
        .btn-save {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--red); color: var(--white); padding: 11px 26px;
            border: none; border-radius: 6px; font-weight: 700; font-size: 0.88rem;
            cursor: pointer; transition: var(--ease);
        }
        .btn-save:hover { background: #B30000; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-cancel {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent; color: var(--muted); padding: 11px 20px;
            border: 1.5px solid #d0c4b0; border-radius: 6px; font-weight: 600; font-size: 0.88rem;
            cursor: pointer; transition: var(--ease);
        }
        .btn-cancel:hover { border-color: var(--black); color: var(--black); }

        /* ── TOAST ─────────────────────────────────────────── */
        #toastArea { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            display: flex; align-items: center; gap: 10px; padding: 14px 20px;
            border-radius: 8px; font-size: 0.88rem; font-weight: 600; max-width: 320px;
            opacity: 0; transform: translateX(30px); transition: all 0.35s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; transform: none; }
        .toast-success { background: #1a7a3f; color: var(--white); }
        .toast-error   { background: var(--red); color: var(--white); }

        /* ── RESPONSIVE ────────────────────────────────────── */
        @media (max-width: 900px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: none; }
            #mainArea { margin-left: 0; }
            #hamburgerBtn { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }
        }
        @media (max-width: 480px) {
            #mainContent { padding: 16px; }
            .dash-grid { grid-template-columns: 1fr 1fr; }
            .card-grid { grid-template-columns: 1fr; }
            #topbar { padding: 0 16px; }
        }
    </style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────────────────────── -->
<div id="loginScreen">
    <div class="login-box">
        <img src="malaika.svg" alt="Logo" onerror="this.style.display='none'">
        <h2>Admin Panel</h2>
        <p>Malaika's Keychen — Secure Access</p>
        <input type="email" id="loginEmail" placeholder="Admin email address" autocomplete="username">
        <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') adminLogin()">
        <button onclick="adminLogin()"><i class="fa-solid fa-lock-open"></i> &nbsp;Sign In</button>
        <div id="loginError"></div>
    </div>
</div>

<!-- ── ADMIN SHELL ─────────────────────────────────────────────────────────── -->
<div id="adminShell" style="display:none">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside id="sidebar">
        <div class="sidebar-brand">
            <img src="malaika.svg" alt="Logo" onerror="this.style.display='none'">
            <span>Malaika's Keychen <em>Admin Panel</em></span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Overview</div>
            <div class="nav-item active" data-section="dashboard" onclick="loadSection('dashboard')">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </div>
            <div class="nav-label" style="margin-top:12px">Content</div>
            <div class="nav-item" data-section="products" onclick="loadSection('products')">
                <i class="fa-solid fa-box-open"></i> Products
            </div>
            <div class="nav-item" data-section="blog" onclick="loadSection('blog')">
                <i class="fa-solid fa-newspaper"></i> Blog Posts
            </div>
            <div class="nav-item" data-section="gallery" onclick="loadSection('gallery')">
                <i class="fa-solid fa-images"></i> Gallery
            </div>
            <div class="nav-item" data-section="menus" onclick="loadSection('menus')">
                <i class="fa-solid fa-utensils"></i> Catering Menus
            </div>
            <div class="nav-label" style="margin-top:12px">Users</div>
            <div class="nav-item" data-section="accounts" onclick="loadSection('accounts')">
                <i class="fa-solid fa-users"></i> Accounts
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user"><i class="fa-solid fa-circle-user" style="margin-right:6px;color:var(--gold)"></i><span id="adminUserEmail"></span></div>
            <button class="btn-logout" onclick="adminLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div id="mainArea">
        <!-- TOPBAR -->
        <div id="topbar">
            <button id="hamburgerBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 id="sectionTitle">Dashboard</h1>
            <div class="topbar-right">
                <span class="topbar-pill"><i class="fa-solid fa-shield-halved" style="color:var(--gold);margin-right:5px"></i>Admin</span>
            </div>
        </div>

        <!-- DYNAMIC CONTENT -->
        <div id="mainContent">
            <div class="loader-wrap"><div class="loader"></div></div>
        </div>
    </div>

</div>

<!-- TOAST CONTAINER -->
<div id="toastArea"></div>

</body>
  </html>
