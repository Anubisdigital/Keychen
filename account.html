 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Account — Malaika's Keychen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-red: #CC0000;
            --brand-black: #1A1A1A;
            --brand-gold: #D4A017;
            --bg-cream: #FDF6EC;
            --bg-section: #F5ECD7;
            --bg-card: #FAF3E0;
            --text-dark: #1A1A1A;
            --text-light: #FFFFFF;
            --text-muted: #6B5B45;
            --whatsapp-green: #25D366;
            --font-heading: 'Marcellus', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: var(--font-body);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- TOP BAR ----- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8%;
            background: var(--text-light);
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--brand-black);
            text-transform: uppercase;
            font-weight: bold;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--brand-black);
            cursor: pointer;
            transition: color 0.3s;
        }

        .menu-toggle-btn:hover {
            color: var(--brand-red);
        }

        /* ----- DRAWER (right side, full height, now a navigation menu) ----- */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .page-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 100%;
            max-width: 380px;
            background: var(--text-light);
            box-shadow: -10px 0 40px rgba(0,0,0,0.3);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        .page-drawer.active {
            transform: translateX(0);
        }

        .drawer-close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--brand-black);
            cursor: pointer;
            margin-bottom: 30px;
        }

        .drawer-close-btn:hover {
            color: var(--brand-red);
        }

        .drawer-nav {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawer-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--brand-black);
            padding: 10px 0;
            border-bottom: 1px solid var(--bg-section);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .drawer-nav a i {
            width: 24px;
            color: var(--brand-red);
            font-size: 1.2rem;
        }

        .drawer-nav a:hover {
            color: var(--brand-red);
        }

        /* ----- MAIN CONTENT (auth forms centred) ----- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            background: var(--text-light);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--bg-section);
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition-smooth);
        }

        .auth-tab.active {
            color: var(--brand-red);
            border-bottom-color: var(--brand-red);
        }

        .form-panel {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .form-panel.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-group input {
            padding: 12px 15px;
            border: 1.5px solid #e0d8ce;
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            background: var(--bg-cream);
            transition: var(--transition-smooth);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--brand-red);
            background: white;
        }

        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary-auth {
            background: var(--brand-red);
            color: white;
        }

        .btn-primary-auth:hover {
            background: #B30000;
        }

        .btn-social {
            background: var(--bg-card);
            color: var(--text-dark);
            border: 1.5px solid #d0c4b0;
            margin-top: 5px;
        }

        .btn-social:hover {
            border-color: var(--brand-black);
            background: white;
        }

        .btn-social i {
            font-size: 1.2rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin: 8px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #d0c4b0;
        }

        .phone-auth-section {
            margin-top: 10px;
            padding: 15px;
            background: var(--bg-cream);
            border-radius: 8px;
            border: 1px dashed var(--brand-gold);
        }

        .phone-auth-section h4 {
            margin-bottom: 12px;
            color: var(--brand-black);
            font-family: var(--font-heading);
        }

        .recaptcha-container {
            margin: 10px 0;
        }

        .error-msg {
            color: var(--brand-red);
            font-size: 0.85rem;
            min-height: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Logged in state on main page */
        .user-info-panel {
            display: none;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .user-info-panel.active {
            display: flex;
        }

        .welcome-message {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--brand-black);
        }

        .user-detail {
            background: var(--bg-cream);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .location-btn {
            background: var(--brand-gold);
            color: var(--brand-black);
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .location-btn:hover {
            background: #c18f15;
        }

        .signout-btn {
            background: var(--brand-black);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .signout-btn:hover {
            background: #333;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }
            .page-drawer {
                max-width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="logo-container">
            <img src="malaika.svg" alt="Malaika's Keychen" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">Malaika's Keychen</span>
        </div>
        <button class="menu-toggle-btn" id="openDrawerBtn" aria-label="Menu">
            <i class="fa-solid fa-bars-staggered"></i>
        </button>
    </header>

    <!-- MAIN CONTENT: AUTH FORMS DISPLAYED DIRECTLY ON PAGE -->
    <main class="main-content">
        <div class="auth-container">
            <!-- AUTH FORMS (visible when not logged in) -->
            <div id="authFormsContainer">
                <div class="auth-tabs">
                    <div class="auth-tab active" data-tab="login">Sign In</div>
                    <div class="auth-tab" data-tab="signup">Create Account</div>
                </div>

                <!-- LOGIN PANEL -->
                <div class="form-panel active" id="loginPanel">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <div class="error-msg" id="loginError"></div>
                    <button class="auth-btn btn-primary-auth" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
                    <div class="divider"><span>or</span></div>
                    <button class="auth-btn btn-social" id="googleSignInBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>
                    <button class="auth-btn btn-social" id="appleSignInBtn"><i class="fa-brands fa-apple"></i> Continue with Apple</button>
                    <div style="text-align:center; margin:10px 0;">
                        <button id="showPhoneLoginBtn" style="background:none; border:none; color:var(--brand-red); font-weight:600; cursor:pointer; text-transform:uppercase;">Login with Phone Number</button>
                    </div>
                </div>

                <!-- SIGNUP PANEL -->
                <div class="form-panel" id="signupPanel">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="signupUsername" placeholder="Your display name">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" autocomplete="email">
                    </div>
                    <div class="input-group">
                        <label>Phone (optional)</label>
                        <input type="tel" id="signupPhone" placeholder="+256..." autocomplete="tel">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="At least 6 characters" autocomplete="new-password">
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm password">
                    </div>
                    <div class="error-msg" id="signupError"></div>
                    <button class="auth-btn btn-primary-auth" id="signupBtn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
                </div>

                <!-- PHONE AUTH PANEL (hidden by default) -->
                <div class="form-panel phone-auth-section" id="phoneAuthPanel">
                    <h4>Phone Sign‑In</h4>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phoneNumberInput" placeholder="+256712345678">
                    </div>
                    <div id="recaptchaContainer" class="recaptcha-container"></div>
                    <button class="auth-btn btn-primary-auth" id="sendCodeBtn">Send Verification Code</button>
                    <div class="input-group" style="margin-top:15px;">
                        <label>Verification Code</label>
                        <input type="text" id="verificationCodeInput" placeholder="123456">
                    </div>
                    <button class="auth-btn btn-primary-auth" id="verifyCodeBtn">Verify & Sign In</button>
                    <div class="error-msg" id="phoneError"></div>
                    <button id="backToLoginFromPhone" style="background:none; border:none; color:var(--brand-red); cursor:pointer; margin-top:10px;">← Back to email login</button>
                </div>
            </div>

            <!-- LOGGED IN USER PANEL (hidden by default) -->
            <div class="user-info-panel" id="userInfoPanel">
                <div class="welcome-message">Welcome back!</div>
                <div class="user-detail" id="userEmailDisplay"><i class="fa-solid fa-envelope"></i> <span></span></div>
                <div class="user-detail" id="userPhoneDisplay"><i class="fa-solid fa-phone"></i> <span></span></div>
                <div class="user-detail" id="userLocationDisplay" style="display:none;"><i class="fa-solid fa-location-dot"></i> <span>Location not shared</span></div>
                <button class="location-btn" id="shareLocationBtn"><i class="fa-solid fa-location-crosshairs"></i> Share My Location</button>
                <p style="font-size:0.75rem; color:var(--text-muted);">Location only shared when you click the button.</p>
                <button class="signout-btn" id="signOutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
            </div>
        </div>
    </main>

    <!-- DRAWER OVERLAY -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- RIGHT-SIDE DRAWER WITH QUICK LINKS -->
    <aside class="page-drawer" id="pageDrawer">
        <button class="drawer-close-btn" id="closeDrawerBtn"><i class="fa-solid fa-xmark"></i></button>
        <nav class="drawer-nav">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
            <a href="location.html"><i class="fa-solid fa-location-dot"></i> Our Location</a>
        </nav>
    </aside>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup, OAuthProvider, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfe2N4mPyWxBmVelw6tbdMtuwjlStsNz8",
            authDomain: "malaikas1.firebaseapp.com",
            projectId: "malaikas1",
            storageBucket: "malaikas1.firebasestorage.app",
            messagingSenderId: "976814756153",
            appId: "1:976814756153:web:86063b30546cac306a18e8",
            measurementId: "G-CMY2N3RTRE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // DOM elements
        const drawer = document.getElementById('pageDrawer');
        const overlay = document.getElementById('drawerOverlay');
        const openBtn = document.getElementById('openDrawerBtn');
        const closeBtn = document.getElementById('closeDrawerBtn');
        const authFormsContainer = document.getElementById('authFormsContainer');
        const userInfoPanel = document.getElementById('userInfoPanel');
        const loginPanel = document.getElementById('loginPanel');
        const signupPanel = document.getElementById('signupPanel');
        const phoneAuthPanel = document.getElementById('phoneAuthPanel');
        const loginTab = document.querySelector('.auth-tab[data-tab="login"]');
        const signupTab = document.querySelector('.auth-tab[data-tab="signup"]');
        const loginError = document.getElementById('loginError');
        const signupError = document.getElementById('signupError');
        const phoneError = document.getElementById('phoneError');
        const googleBtn = document.getElementById('googleSignInBtn');
        const appleBtn = document.getElementById('appleSignInBtn');
        const showPhoneLoginBtn = document.getElementById('showPhoneLoginBtn');
        const backToLoginBtn = document.getElementById('backToLoginFromPhone');
        const shareLocationBtn = document.getElementById('shareLocationBtn');
        const signOutBtn = document.getElementById('signOutBtn');
        const userEmailDisplay = document.getElementById('userEmailDisplay').querySelector('span');
        const userPhoneDisplay = document.getElementById('userPhoneDisplay').querySelector('span');
        const userLocationDisplay = document.getElementById('userLocationDisplay');

        // Drawer toggles (now just navigation links)
        function openDrawer() {
            drawer.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        openBtn.addEventListener('click', openDrawer);
        closeBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);

        // Tab switching
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginPanel.classList.add('active');
            signupPanel.classList.remove('active');
            phoneAuthPanel.classList.remove('active');
            loginError.textContent = '';
            signupError.textContent = '';
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupPanel.classList.add('active');
            loginPanel.classList.remove('active');
            phoneAuthPanel.classList.remove('active');
            signupError.textContent = '';
        });

        // ---------- AUTH STATE OBSERVER ----------
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                authFormsContainer.classList.add('hidden');
                userInfoPanel.classList.add('active');
                const userDocRef = doc(db, "accounts", user.uid);
                const userSnap = await getDoc(userDocRef);
                let userData = userSnap.data() || {};
                userEmailDisplay.textContent = user.email || user.phoneNumber || '—';
                userPhoneDisplay.textContent = userData.phone || user.phoneNumber || '—';
                if (userData.location && userData.locationEnabled) {
                    userLocationDisplay.style.display = 'flex';
                    userLocationDisplay.querySelector('span').textContent = `Lat: ${userData.location.lat.toFixed(4)}, Lng: ${userData.location.lng.toFixed(4)}`;
                } else {
                    userLocationDisplay.style.display = 'none';
                }
            } else {
                authFormsContainer.classList.remove('hidden');
                userInfoPanel.classList.remove('active');
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
                loginError.textContent = '';
                signupError.textContent = '';
            }
        });

        // ---------- EMAIL / PASSWORD SIGN‑IN ----------
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            loginError.textContent = '';
            if (!email || !password) {
                loginError.textContent = 'Please fill in both fields.';
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = error.message;
            }
        });

        // ---------- CREATE ACCOUNT ----------
        document.getElementById('signupBtn').addEventListener('click', async () => {
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;
            signupError.textContent = '';
            if (!username || !email || !password) {
                signupError.textContent = 'Username, email and password are required.';
                return;
            }
            if (password !== confirm) {
                signupError.textContent = 'Passwords do not match.';
                return;
            }
            if (password.length < 6) {
                signupError.textContent = 'Password must be at least 6 characters.';
                return;
            }
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await setDoc(doc(db, "accounts", user.uid), {
                    username: username,
                    email: email,
                    phone: phone || null,
                    location: null,
                    locationEnabled: false,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                signupError.textContent = error.message;
            }
        });

        // ---------- GOOGLE SIGN‑IN ----------
        googleBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "accounts", user.uid);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        username: user.displayName || '',
                        email: user.email,
                        phone: user.phoneNumber || null,
                        location: null,
                        locationEnabled: false,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (error) {
                loginError.textContent = error.message;
            }
        });

        // ---------- APPLE SIGN‑IN ----------
        appleBtn.addEventListener('click', async () => {
            const provider = new OAuthProvider('apple.com');
            provider.addScope('email');
            provider.addScope('name');
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userRef = doc(db, "accounts", user.uid);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        username: user.displayName || '',
                        email: user.email,
                        phone: user.phoneNumber || null,
                        location: null,
                        locationEnabled: false,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (error) {
                loginError.textContent = error.message;
            }
        });

        // ---------- PHONE AUTH ----------
        let recaptchaVerifier = null;
        let phoneConfirmationResult = null;

        function initRecaptcha() {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptchaContainer', {
                    size: 'normal',
                    callback: (response) => {
                        // reCAPTCHA solved
                    }
                });
                recaptchaVerifier.render().catch(err => console.log("Recaptcha render error", err));
            }
        }

        showPhoneLoginBtn.addEventListener('click', () => {
            loginPanel.classList.remove('active');
            signupPanel.classList.remove('active');
            phoneAuthPanel.classList.add('active');
            loginTab.classList.remove('active');
            signupTab.classList.remove('active');
            initRecaptcha();
        });

        backToLoginBtn.addEventListener('click', () => {
            phoneAuthPanel.classList.remove('active');
            loginPanel.classList.add('active');
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
        });

        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const phoneNumber = document.getElementById('phoneNumberInput').value.trim();
            phoneError.textContent = '';
            if (!phoneNumber) {
                phoneError.textContent = 'Enter phone number.';
                return;
            }
            try {
                initRecaptcha();
                phoneConfirmationResult = await signInWithPhoneNumber(auth, phoneNumber, recaptchaVerifier);
                phoneError.textContent = 'Code sent! Check your SMS.';
            } catch (error) {
                phoneError.textContent = error.message;
            }
        });

        document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
            const code = document.getElementById('verificationCodeInput').value.trim();
            if (!code || !phoneConfirmationResult) {
                phoneError.textContent = 'Enter verification code.';
                return;
            }
            try {
                const result = await phoneConfirmationResult.confirm(code);
                const user = result.user;
                const userRef = doc(db, "accounts", user.uid);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        username: '',
                        email: null,
                        phone: user.phoneNumber,
                        location: null,
                        locationEnabled: false,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (error) {
                phoneError.textContent = error.message;
            }
        });

        // ---------- LOCATION SHARING ----------
        shareLocationBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                const userRef = doc(db, "accounts", currentUser.uid);
                await updateDoc(userRef, {
                    location: { lat: latitude, lng: longitude },
                    locationEnabled: true
                });
                userLocationDisplay.style.display = 'flex';
                userLocationDisplay.querySelector('span').textContent = `Lat: ${latitude.toFixed(4)}, Lng: ${longitude.toFixed(4)}`;
                alert('Location shared successfully!');
            }, (error) => {
                alert('Unable to retrieve location. Please check your device settings.');
            });
        });

        // ---------- SIGN OUT ----------
        signOutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });
    </script>
</body>
</html>
